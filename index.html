<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>JARVIS 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#e8f3ff;font-family:Arial,sans-serif}
.app{max-width:480px;margin:auto;padding:25px 20px}
h1{text-align:center;letter-spacing:8px;color:#48c8ff}
#status{text-align:center;color:#55d9ad}
.orb{width:190px;height:190px;border:2px solid #32baff;border-radius:50%;margin:35px auto;display:flex;align-items:center;justify-content:center;font-size:55px;color:#49caff;box-shadow:0 0 35px #168cff66}
.orb.active{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 65px #168cff}}
button,input{padding:15px;border-radius:12px;border:1px solid #2879a9;background:#101e30;color:white;font-size:16px}
button{cursor:pointer}
.mic{width:100%;background:#087fba}
.controls{display:flex;gap:8px;margin-top:15px}
input{width:70%;min-width:0}
.send{background:#087fba}
#answer{margin-top:20px;padding:17px;background:#101e30;border-radius:12px;min-height:85px;line-height:1.6}
.info{text-align:center;color:#718ba5;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="app">
<h1>J.A.R.V.I.S</h1>
<div id="status">SYSTEM ONLINE</div>
<div class="orb" id="orb">◉</div>
<button class="mic" id="mic">🎙 GAPIRISH</button>
<div class="controls">
<input id="message" placeholder="Buyruq bering...">
<button class="send" id="send">Yuborish</button>
</div>
<div id="answer">Assalomu alaykum! Men JARVIS. Sizni tinglashga tayyorman.</div>
<div class="info">JARVIS AI · VERSION 3.0<br>OFFLINE COMMAND SYSTEM</div>
</div>

<script>
(function(){
"use strict";

const answer=document.getElementById("answer");
const status=document.getElementById("status");
const input=document.getElementById("message");
const orb=document.getElementById("orb");

let memory=[];
try{
memory=JSON.parse(localStorage.getItem("jarvis_memory")||"[]");
}catch(e){memory=[];}

function speak(text) {
    if (!window.speechSynthesis) return;

    window.speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();

    const uzVoice = voices.find(v =>
        v.lang.toLowerCase().startsWith("uz")
    );

    if (uzVoice) {
        u.voice = uzVoice;
        u.lang = uzVoice.lang;
    } else {
        u.lang = "uz-UZ";
    }

    u.rate = 0.85;
    u.pitch = 0.95;
    u.volume = 1;

    window.speechSynthesis.speak(u);
}

function reply(text){
answer.textContent=text;
speak(text);
}

function command(text){
const q=text.toLowerCase().trim();
if(!q)return;

if(q.includes("salom")){
reply("Va alaykum assalom! Sizni eshitib turibman.");
}
else if(q.includes("vaqt")){
reply("Hozirgi vaqt: "+new Date().toLocaleTimeString("uz-UZ"));
}
else if(q.includes("sana")||q.includes("bugun")){
reply("Bugungi sana: "+new Date().toLocaleDateString("uz-UZ"));
}
else if(q.includes("isming")){
reply("Mening ismim JARVIS. Men sizning shaxsiy yordamchingizman.");
}
else if(q.includes("yordam")){
reply("Men salomlashish, vaqt va sanani aytish, eslatmalarni saqlash buyruqlarini bajara olaman.");
}
else if(q.startsWith("eslab qol")){
const value=text.substring(10).trim();
if(value){
memory.push(value);
localStorage.setItem("jarvis_memory",JSON.stringify(memory));
reply("Ma'lumot xotiramga saqlandi.");
}else reply("Nimani eslab qolay?");
}
else if(q.includes("xotiram")){
reply(memory.length ? "Xotiramda "+memory.length+" ta yozuv bor. Oxirgisi: "+memory[memory.length-1] : "Xotiram hozircha bo'sh.");
}
else if(q.includes("to'xta")||q.includes("to‘xta")){
window.speechSynthesis.cancel();
answer.textContent="Ovoz to'xtatildi.";
}
else{
reply("Bu buyruq hozircha oflayn tizimimda mavjud emas.");
}
}

document.getElementById("send").addEventListener("click",function(){
const text=input.value;
if(!text.trim())return;
input.value="";
command(text);
});

input.addEventListener("keydown",function(e){
if(e.key==="Enter")document.getElementById("send").click();
});

document.getElementById("mic").addEventListener("click",function(){
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Recognition){
reply("Safari ovozni tanish funksiyasini qo'llab-quvvatlamayapti. Matn orqali buyruq bering.");
return;
}
try{
const rec=new Recognition();
rec.lang="uz-UZ";
rec.continuous=false;
rec.interimResults=false;
status.textContent="TINGLAYAPMAN...";
orb.classList.add("active");
rec.onresult=function(e){
const text=e.results[0][0].transcript;
input.value=text;
command(text);
};
rec.onerror=function(e){
answer.textContent="Ovoz xatosi: "+e.error;
};
rec.onend=function(){
status.textContent="SYSTEM ONLINE";
orb.classList.remove("active");
};
rec.start();
}catch(e){
status.textContent="MIKROFON XATOSI";
}
});

})();
</script>
</body>
</html>
